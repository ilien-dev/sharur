<text x="24.0" y="623" class="m" font-size="14" xml:space="preserve"><tspan fill="$ink">Fable 5.2 </tspan><tspan fill="$accent">−77% words · −28% cost · −38% tool calls      </tspan><tspan fill="$ink">Opus 5.5 </tspan><tspan fill="$accent">−76% words · −23% cost      </tspan><tspan fill="$ink">plain questions on Opus 5.5 </tspan><tspan fill="$accent">357 → 63 tokens      </tspan><tspan fill="$ink">every request </tspan><tspan fill="$accent">379 fewer input tokens      </tspan><tspan fill="$ink">tested with </tspan><tspan fill="$accent">9 prompts on 4 models      </tspan><tspan fill="$ink">install </tspan><tspan fill="$accent">one small file      </tspan><tspan fill="$ink">licence </tspan><tspan fill="$accent">MIT      </tspan></text>
<text x="2275.2" y="623" class="m" font-size="14" xml:space="preserve"><tspan fill="$ink">Fable 5.2 </tspan><tspan fill="$accent">−77% words · −28% cost · −38% tool calls      </tspan><tspan fill="$ink">Opus 5.5 </tspan><tspan fill="$accent">−76% words · −23% cost      </tspan><tspan fill="$ink">plain questions on Opus 5.5 </tspan><tspan fill="$accent">357 → 63 tokens      </tspan><tspan fill="$ink">every request </tspan><tspan fill="$accent">379 fewer input tokens      </tspan><tspan fill="$ink">tested with </tspan><tspan fill="$accent">9 prompts on 4 models      </tspan><tspan fill="$ink">install </tspan><tspan fill="$accent">one small file      </tspan><tspan fill="$ink">licence </tspan><tspan fill="$accent">MIT      </tspan></text>
