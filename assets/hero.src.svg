<text x="24.0" y="623" class="m" font-size="14" xml:space="preserve"><tspan fill="$ink">medium tasks </tspan><tspan fill="$accent">−21% cost · −54% words      </tspan><tspan fill="$ink">large tasks </tspan><tspan fill="$accent">−10% cost      </tspan><tspan fill="$ink">huge task </tspan><tspan fill="$accent">−6% cost      </tspan><tspan fill="$ink">short questions </tspan><tspan fill="$accent">−37% cost      </tspan><tspan fill="$ink">hidden tests </tspan><tspan fill="$accent">all passed with both styles      </tspan><tspan fill="$ink">every request </tspan><tspan fill="$accent">331 fewer input tokens      </tspan><tspan fill="$ink">tested with </tspan><tspan fill="$accent">13 tasks, 3 runs each, Opus 5.5      </tspan><tspan fill="$ink">install </tspan><tspan fill="$accent">one small file      </tspan><tspan fill="$ink">licence </tspan><tspan fill="$accent">MIT      </tspan></text>
