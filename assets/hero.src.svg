<!--palette
bg     #0F1115 #F0F5FB
panel  #171A20 #FFFFFF
line   #2A2F37 #D3DCE7
ink    #F2F0EA #0F1115
body   #C9CDD3 #3A3F48
muted  #A3A8B0 #555B64
ghost  #3A404A #BCC7D4
accent #4FD1C5 #0B7A70
