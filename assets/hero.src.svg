<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Sharur, an output style for Claude Code. Against Concise on Opus 5.5 it cut the cost of everyday coding tasks by 21%, large ones by 10% and a huge one by 6%, 12% across the three sizes, with the same hidden tests passed. Asked to add a multiply function with a test, it replied in 37 words, where Concise wrote 89.">
<style>
@keyframes drift{to{transform:translate(24px,24px)}}
@keyframes tick{to{transform:translateX(-2562.0px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(.72)}}
@keyframes caret{0%,100%{opacity:1}50%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes on{0%{opacity:0}2%,96%{opacity:1}100%{opacity:0}}
@keyframes in{0%{opacity:0;transform:translateY(10px)}3%,96%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes c1{0%,100%{opacity:1}12%{opacity:0}}
@keyframes c2{0%,100%{opacity:0}12%{opacity:1}}
.drift{animation:drift 4s linear infinite}
.tick{animation:tick 38s linear infinite}
.breathe{animation:breathe 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.caret{animation:caret 1.1s steps(1,end) infinite}
.flow{animation:flow 1.2s linear infinite}
.on{animation:on 10s ease-out infinite}
.in{animation:in 10s cubic-bezier(0,0,.2,1) infinite}
.c1{animation:c1 10s steps(1,end) infinite}
.c2{animation:c2 10s steps(1,end) infinite}
.nl{font-variant-ligatures:none}
@keyframes type1{0%,2%{transform:translateX(-326.4px);animation-timing-function:steps(34,end)}12%,92%{transform:translateX(0);animation-timing-function:steps(34,end)}100%{transform:translateX(-326.4px)}}
@keyframes type2{0%,12%{transform:translateX(-297.6px);animation-timing-function:steps(31,end)}19%,92%{transform:translateX(0);animation-timing-function:steps(31,end)}100%{transform:translateX(-297.6px)}}
.type1{animation:type1 10s linear infinite}
.type2{animation:type2 10s linear infinite}
/* 10 s  prompt   |line 1 0.2-1.2|line 2 1.2-1.9|======= shown =======|back 9.2|
         rule (parcel) leaves the file  |2.0 down 2.8 right 3.2|
         reply lines 3.2 3.5 3.8 4.1 4.4, teal tokens with them, "37 words" 4.7
         what Concise adds: bars 4.6 + .25 each, grey tokens with them; each dims 2.2 s after it lands */
@keyframes rule{0%,20%{transform:translate(0,0);opacity:0}22%{opacity:1}28%{transform:translate(0,122px);opacity:1}32%{transform:translate(48px,122px);opacity:1}34%,100%{transform:translate(48px,122px);opacity:0}}
@keyframes ghost{0%{opacity:0}3%,22%{opacity:1}28%,96%{opacity:.3}100%{opacity:0}}
@keyframes mark{0%,100%{opacity:.35}50%{opacity:1}}
.rule{animation:rule 10s cubic-bezier(.4,0,.2,1) infinite}
.ghost{animation:ghost 10s ease-out infinite}
.mark{animation:mark 3s ease-in-out infinite}
</style>
