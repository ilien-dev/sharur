<text x="198" y="434" class="b" font-size="30" fill="$ink">−35%</text><rect x="198" y="448" width="100" height="6" rx="3" fill="$line"/><rect x="198" y="448" width="35" height="6" rx="3" fill="$ink"/><text x="198" y="478" class="m" font-size="14" fill="$muted">Sonnet 5.5</text>
<text x="324" y="434" class="b" font-size="30" fill="$ink">−33%</text><rect x="324" y="448" width="100" height="6" rx="3" fill="$line"/><rect x="324" y="448" width="33" height="6" rx="3" fill="$ink"/><text x="324" y="478" class="m" font-size="14" fill="$muted">Haiku 5.5</text>
<text x="450" y="434" class="b" font-size="30" fill="$ink">−29%</text><rect x="450" y="448" width="100" height="6" rx="3" fill="$line"/><rect x="450" y="448" width="29" height="6" rx="3" fill="$ink"/><text x="450" y="478" class="m" font-size="14" fill="$muted">Opus 5.5</text>
<text x="72" y="514" class="m" font-size="14" fill="$muted">output tokens per task, against Concise</text>
</g>
