<text id="name" x="126" y="92" class="b" font-size="34" fill="$ink">sharur</text>
<text id="tagline" class="b" font-size="44" letter-spacing="-1" fill="$ink"><tspan x="72" y="196">Shorter replies.</tspan><tspan x="72" y="248" fill="$accent">21% cheaper day to day.</tspan></text>
<text id="about" class="s" font-size="20" fill="$body"><tspan x="72" y="302">A short output style for Claude Code.</tspan><tspan x="72" y="330">Same tests passed, same facts kept.</tspan></text>
<g id="facts">
<text x="72" y="434" class="b" font-size="30" fill="$accent">−21%</text><rect x="72" y="448" width="100" height="6" rx="3" fill="$line"/><rect x="72" y="448" width="21" height="6" rx="3" fill="$accent"/><text x="72" y="478" class="m" font-size="14" fill="$muted">medium</text>
<text x="198" y="434" class="b" font-size="30" fill="$ink">−10%</text><rect x="198" y="448" width="100" height="6" rx="3" fill="$line"/><rect x="198" y="448" width="10" height="6" rx="3" fill="$ink"/><text x="198" y="478" class="m" font-size="14" fill="$muted">large</text>
<text x="324" y="434" class="b" font-size="30" fill="$ink">−6%</text><rect x="324" y="448" width="100" height="6" rx="3" fill="$line"/><rect x="324" y="448" width="6" height="6" rx="3" fill="$ink"/><text x="324" y="478" class="m" font-size="14" fill="$muted">huge</text>
<text x="450" y="434" class="b" font-size="30" fill="$ink">−12%</text><rect x="450" y="448" width="100" height="6" rx="3" fill="$line"/><rect x="450" y="448" width="12" height="6" rx="3" fill="$ink"/><text x="450" y="478" class="m" font-size="14" fill="$muted">average</text>
<text x="72" y="514" class="m" font-size="14" fill="$muted">cost per task against Concise, Opus 5.5</text>
</g>
