<text id="name" x="126" y="92" class="b" font-size="34" fill="$ink">sharur</text>
<text id="tagline" class="b" font-size="44" letter-spacing="-1" fill="$ink"><tspan x="72" y="196">Shorter replies.</tspan><tspan x="72" y="248" fill="$accent">Up to 48% fewer tokens.</tspan></text>
<text id="about" class="s" font-size="20" fill="$body"><tspan x="72" y="302">A one-line output style for Claude Code.</tspan><tspan x="72" y="330">Up to 77% fewer words to read in each reply.</tspan></text>
