<text class="m in" style="animation-delay:-6.80s" x="830" y="188" font-size="16" fill="$ink">Merge: joins branches with merge commit,</text>
<text class="m in" style="animation-delay:-6.50s" x="830" y="213" font-size="16" fill="$ink">keeps true history. Rebase: replays your</text>
<text class="m in" style="animation-delay:-6.20s" x="830" y="238" font-size="16" fill="$ink">commits onto new base, linear history,</text>
<text class="m in" style="animation-delay:-5.90s" x="830" y="263" font-size="16" fill="$ink">rewrites hashes — avoid on shared</text>
<text class="m in" style="animation-delay:-5.60s" x="830" y="288" font-size="16" fill="$ink">branches.</text>
